source: >-
  Live probes of every host this record knows — the registrable domain and www
  (bd.com / www.bd.com, the Website and product-docs host), the CareFusion brand domain and
  www (carefusion.com / www.carefusion.com), the Marketo landing host named in
  apis[].properties (pages.carefusion.com) and its BD successor (go.bd.com), the surviving
  CareFusion customer portal (rsscp.carefusion.com), and the two BD API-shaped hostnames that
  resolve in DNS (api.bd.com, apis.bd.com).
description: >-
  NO /.well-known/ document is served on any host in the CareFusion record. CareFusion
  publishes no API baseURL and no OpenAPI, so the probe set is the brand and corporate web
  hosts plus every API-shaped hostname that resolves. Results by host: www.bd.com and bd.com
  answer a genuine HTTP 404 (an 11,891-byte HTML error page) on every path — the Akamai edge
  returns 403 Access Denied to a plain crawler user agent, so each 404 above was re-confirmed
  with a browser-class request the edge does serve. www.carefusion.com 301s to www.bd.com and
  inherits the same 404s; the carefusion.com apex has NO DNS record at all. pages.carefusion.com
  (Marketo) and go.bd.com answer HTTP 200 to every path with an ~18KB marketing HTML shell,
  and rsscp.carefusion.com (the AngularJS "BD - RSS Customer Portal" login) answers 200 with the
  same 1,940-byte SPA shell for every path — these are catch-all HTML shells, NOT documents,
  and are recorded as misses. api.bd.com resolves to a Microsoft Azure Application Gateway that
  answers 502 Bad Gateway on every path (no backend); apis.bd.com resolves to 204.193.55.16 but
  never completes a TCP handshake. NO WellKnown and NO SecurityTxt pointer is emitted from this
  file — it records an ABSENCE. No A2A agent card exists on any host, so a2a/ is intentionally
  empty rather than stubbed.
