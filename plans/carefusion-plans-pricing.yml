description: >-
  CareFusion (BD) publishes NO plans and NO pricing of any kind. BD Alaris and BD Pyxis are
  capital medical equipment with per-hospital service and interoperability agreements quoted
  by BD sales; there is no self-serve tier, no published list price, and no API to meter. The
  bd.com/en-us sitemap contains no pricing page, and every product page routes to
  "Contact us" rather than a price. plan_count is 0 and that is the measurement.
  REPLACES a 2026-05-04 bulk-sweep scaffold that asserted invented Free / Professional /
  Enterprise tiers with 1,000 and 100,000 request quotas and 10/100/1,000 rpm rate limits.
  None of those numbers came from BD; they were template defaults. See roadmap#35.
