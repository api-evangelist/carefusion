description: >-
  CareFusion (BD) documents NO rate limits, because it publishes no callable API. There is no
  baseURL, no OpenAPI, no developer portal and no runtime surface on which a limit could be
  signalled — no X-RateLimit-*, no RateLimit-*, no Retry-After, no 429. Alaris and Pyxis
  integrate over HL7 v2 interfaces configured per hospital by BD interface-engineering teams,
  where throughput is an engagement parameter rather than a published quota. limit_count is 0
  and that is the measurement.
  REPLACES a 2026-05-04 bulk-sweep scaffold that asserted 10/100/1,000 requests-per-minute
  tiers, 1,000 and 100,000 monthly quotas, and a full X-RateLimit-*/429 header contract. None
  of it came from BD. See roadmap#35.
