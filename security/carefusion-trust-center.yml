    evidence: https://www.bd.com/content/dam/bd-assets/bd-com/en-us/document/cybersecurity/bd_certificate/bdx-bd-anz-iso-27001-primary-certificate-2025.pdf
    evidence_status: 200
    note: Downloadable certificate PDFs, entity-scoped rather than enterprise-wide.
  - name: UL 2900-2-1 (UL Cybersecurity Assurance Program)
    scope: BD Synapsys v6.11
    verified: true
    evidence: https://www.bd.com/content/dam/bd-assets/bd-com/en-us/document/cybersecurity/bd-synapsys/BD-Synapsys_v611_UL-2900-2-1_Certificate.pdf
    evidence_status: 200
    note: >-
      Product-scoped to BD Synapsys (an informatics product), NOT to BD Alaris or BD Pyxis.
      Recorded to show what BD actually publishes, not to credit the CareFusion lines.
  - name: SOC 2+ (Security, Availability)
    scope: BD cloud-based products
    verified: false
    evidence: https://www.bd.com/en-us/about-bd/cybersecurity?active-tab=2
    evidence_status: 200
    note: Asserted on the Trust Center; the report itself is request-only, so not independently readable.
  - name: MDS2 (Manufacturer Disclosure Statement for Medical Device Security)
    scope: Per BD product, including BD Alaris and BD Pyxis
    verified: false
    evidence: https://www.bd.com/en-us/about-bd/cybersecurity?active-tab=2
    evidence_status: 200
    note: >-
      Delivered inside per-product Product Security White Papers, which BD restricts to
      existing customers on request — the document itself is not publicly readable.
